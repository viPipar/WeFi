name: Build weFi APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: |
        if ! ./gradlew testDebugUnitTest --no-daemon --stacktrace > test_run.log 2>&1; then
          tail -n 100 test_run.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-failure-log
          cp test_run.log build_failure_details.txt
          git add build_failure_details.txt
          git commit -m "ci: capture build and test failure details"
          git push origin ci-failure-log --force
          exit 1
        fi

    - name: Upload Test Report on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          test_run.log
          app/build/reports/

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: weFi-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14

    - name: Publish GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "weFi v1.0.0 (Release Build)"
        body: |
          ## weFi - Mobile Wi-Fi Analyzer 📶
          Unduh dan pasang berkas APK di bawah ini ke smartphone Android Anda untuk memulai pengujian spektrum dan estimasi jarak!

          ### 📦 File Unduhan:
          - Klik **`app-debug.apk`** di bagian *Assets* di bawah untuk mengunduh langsung ke HP.

          ### 🚀 Fitur Unggulan:
          - **Grafik Spektrum Parabola (2.4, 5.0, 6.0 GHz)**
          - **Garis Vertikal Penanda AP Terhubung (Connected Plumb-Line)**
          - **Estimasi Jarak Matematika (Log-Distance Path Loss)**
          - **Speedtest Throughput & Latensi Aktif**
          - **Juicy Morphing Floating Help Assistant**
          - **Desain Blynk.io Style Putih-Biru (#77ADF9)**
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
