name: Build weFi APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: |
        if ! ./gradlew testDebugUnitTest --no-daemon --stacktrace > test_run.log 2>&1; then
          tail -n 100 test_run.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-failure-log
          cp test_run.log build_failure_details.txt
          git add build_failure_details.txt
          git commit -m "ci: capture build and test failure details"
          git push origin ci-failure-log --force
          exit 1
        fi

    - name: Upload Test Report on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          test_run.log
          app/build/reports/

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: weFi-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14

    - name: Publish GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.2.0' }}
        name: "weFi ${{ github.ref_type == 'tag' && github.ref_name || 'v1.2.0' }} - Network Discovery & Lab Audit (Release Build)"
        body: |
          ## weFi - Mobile Wi-Fi Spectrum Analyzer & Network Telemetry 📶
          Unduh dan pasang berkas APK di bawah ini ke smartphone Android Anda untuk memulai pengujian spektrum dan audit penemuan jaringan lab!

          ### 📦 File Unduhan:
          - Klik **`app-debug.apk`** di bagian *Assets* di bawah untuk mengunduh langsung ke smartphone Android.

          ### 🚀 Fitur Unggulan & Pembaruan v1.2.0:
          - **Audit Penemuan Jaringan (Lab CCTV & Router Discovery):** Modul observasi non-root untuk jaringan lab terisolasi dengan Ping Sweep, TCP Connect port scan (80, 443, 554 RTSP, 3702 ONVIF), SSDP UPnP multicast, dan mDNS NsdManager resmi.
          - **Database OUI Vendor & Snapshot CVE Edukasi:** Identifikasi vendor perangkat lab (Hikvision, Dahua, Axis, TP-Link, dll.) dan korelasi informasi potensi kerentanan CVE offline.
          - **Proteksi Safety Throttler & Circuit Breaker:** Token bucket rate-limiter 200 paket/detik, pendinginan 30s per-host, dan deteksi otomatis isolasi klien pada Access Point.
          - **Generator Laporan Lengkap:** Fitur salin ke clipboard dan bagikan ringkasan audit dalam format Teks Terstruktur dan JSON.
          - **Mode Hybrid & Passphrase Vault:** Otomatisasi pengujian multi-router dengan 56 modul passphrase lab dan penyimpanan permanen vault.
          - **100% Offline Resilience:** Pengoperasian lokal 802.11 tanpa memerlukan koneksi WAN internet.
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
